<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#86D8F7" />
    <title>Más que Tartas Mattilde – Obrador artesanal en Chiclana de la Frontera</title>
    <meta
      name="description"
      content="Cafetería, obrador y pastelería artesanal en Chiclana de la Frontera. Tartas personalizadas, desayunos y dulces hechos con amor por Mattilde."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.mattilde.es/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mattilde.es/" />
    <meta property="og:title" content="Más que Tartas Mattilde – Obrador artesanal en Chiclana" />
    <meta
      property="og:description"
      content="Tartas personalizadas, desayunos y dulces artesanales en Chiclana de la Frontera, Cádiz."
    />
    <meta property="og:locale" content="es_ES" />
    <!-- Seguridad -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws:; frame-ancestors 'none';"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=()"
    />
    <!-- Rendimiento: DNS prefetch y preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- Fuentes Google -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600;700&family=Nunito:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <a href="#contenido-principal" class="saltar-contenido">Saltar al contenido principal</a>
    <div id="root"></div>

  </body>
</html>
